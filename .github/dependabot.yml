# Dependency updates (ADR-0022). The pip, npm and Docker ecosystems are added by the issues
# that create those manifests (P0-02, P0-03, P0-08).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:ci", "module:repo"]
    commit-message:
      prefix: "ci(repo)"

  # Python: Dependabot updates the exact pins in pyproject.toml; the lock files are regenerated
  # in the same pull request before merge (tests/workspace/test_lock_files.py fails until then).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["type:build", "module:repo"]
    commit-message:
      prefix: "build(repo)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: ["type:build", "module:web"]
    commit-message:
      prefix: "build(web)"
