# Contracts (P0-05): schemas and examples are valid; generated types are current.
name: contracts

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels the pull request's older runs (#386). Pushes to one
# branch (main) share a group: a running one is never cancelled, and only the newest waiting
# one is kept, since it tests everything the older ones would (#391).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install the Python tools and the web tools
        run: |
          python -m pip install --quiet pip==26.2.2
          python -m pip install --quiet -r pylock.toml
          npm ci --prefix web
      - name: Validate schemas and examples
        run: python -m tools.contracts.validate
      - name: Generated types are current
        run: python -m tools.contracts.generate --check
