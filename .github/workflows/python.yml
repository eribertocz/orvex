# Python checks (P0-02): format, lint, strict types and tests, with exact versions from the lock files.
name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install from the lock file
        run: |
          python -m pip install --quiet pip==26.2.2
          python -m pip install --quiet -r pylock.toml
      - run: ruff format --check .
      - run: ruff check .

  python-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install from the lock file and the workspace packages
        run: |
          python -m pip install --quiet pip==26.2.2
          python -m pip install --quiet -r pylock.toml
          for package in packages/*/; do
            python -m pip install --quiet --no-deps --no-build-isolation -e "$package"
          done
      - name: Strict types (module sources)
        run: mypy -p orvex.store -p orvex.transform -p orvex.semantic -p orvex.access -p orvex.dashboards -p orvex.mcp -p orvex.server -p orvex.contracts
      - name: Strict types (tests and scripts)
        run: mypy packages/*/tests tests tools conformance .github/workflows/scripts

  python-tests:
    name: python-tests-${{ matrix.python }}
    runs-on: ubuntu-latest
    # A hung test must fail the job, not hold it for the default six hours. The suite takes
    # about 16 minutes; #120 runs the shared lake tests on a third catalog (SQLite).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.15"
            lock: pylock.toml
          - python: "3.14"
            lock: pylock.py314.toml
    # PostgreSQL catalog for the store tests (P1-02); a disposable database, not a secret.
    services:
      postgres:
        # postgres:18.6-trixie
        image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: ci-disposable-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # ClickHouse source for the extraction-model tests (P1-17, #65, #98); a disposable server,
      # not a secret. The tests create their own read-only user and synthetic tables.
      clickhouse:
        # clickhouse/clickhouse-server:26.9.25.15
        image: clickhouse/clickhouse-server@sha256:19bfacb135479a892551a8155cfbbc8211aedf2aa888cd91950b9ee7e76cc7e3
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci-disposable-database
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user ci --password ci-disposable-database --query 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      STORE_TEST_POSTGRES: host=localhost port=5432 dbname=postgres user=postgres
      STORE_TEST_POSTGRES_PASSWORD: ci-disposable-database
      # The PostgreSQL with TLS started below (#120), reached through 127.0.0.2: a host that is
      # not the local machine for the catalog rule, so verify-full is required and tested.
      STORE_TEST_POSTGRES_TLS: host=127.0.0.2 port=5433 dbname=postgres user=postgres
      TRANSFORM_TEST_CLICKHOUSE: http://localhost:8123
      TRANSFORM_TEST_CLICKHOUSE_USER: ci
      TRANSFORM_TEST_CLICKHOUSE_PASSWORD: ci-disposable-database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the lock file and the workspace packages
        run: |
          python -m pip install --quiet pip==26.2.2
          python -m pip install --quiet -r ${{ matrix.lock }}
          for package in packages/*/; do
            python -m pip install --quiet --no-deps --no-build-isolation -e "$package"
          done
      - name: Start a PostgreSQL with TLS for the catalog tests (#120)
        # A certificate authority and a server certificate made for this job only: disposable,
        # never committed, not secrets. The CA file is given to the tests by its path.
        run: |
          dir="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$dir"
          cd "$dir"
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -subj "/CN=ci-test-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:3072 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.csr
          printf '%s\n' "basicConstraints=CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" \
            "subjectAltName=DNS:localhost,IP:127.0.0.1,IP:127.0.0.2" > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.crt
          rm ca.key server.csr
          # The image's postgres user (uid 999) must own the key, readable by it only.
          sudo chown 999:999 server.key server.crt
          sudo chmod 600 server.key
          # postgres:18.6-trixie, the same image as the service above.
          docker run --detach --name postgres-tls --publish 5433:5432 \
            --env POSTGRES_PASSWORD=ci-disposable-database \
            --volume "$dir/server.crt:/tls/server.crt:ro" \
            --volume "$dir/server.key:/tls/server.key:ro" \
            postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          # Ready when it accepts TCP connections (the first start listens on a socket only).
          for attempt in $(seq 60); do
            if docker exec postgres-tls pg_isready -U postgres -h 127.0.0.1 -q; then break; fi
            sleep 1
          done
          docker exec postgres-tls pg_isready -U postgres -h 127.0.0.1
          echo "STORE_TEST_POSTGRES_TLS_CA=$dir/ca.crt" >> "$GITHUB_ENV"
      - run: pytest --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        run: python -m tools.ci.junit_annotations junit.xml

  python-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Two clean installs from pylock.toml produce identical versions
        run: |
          for attempt in first second; do
            python -m venv "/tmp/$attempt"
            "/tmp/$attempt/bin/python" -m pip install --quiet pip==26.2.2
            "/tmp/$attempt/bin/python" -m pip install --quiet -r pylock.toml
            "/tmp/$attempt/bin/python" -m pip freeze > "/tmp/$attempt.txt"
          done
          diff /tmp/first.txt /tmp/second.txt
          cat /tmp/first.txt
