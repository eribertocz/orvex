# The CI alert listener (#428): no failing or missing run of a watched workflow goes unseen.
# Every run reconciles: it reads the newest runs of every watched context (scripts/ci_alerts.toml)
# and brings each tracking issue to the state they imply, so a lost, repeated, retried or
# out-of-order event cannot leave a wrong state. It runs only the reporter from the default
# branch: it checks out no pull request, downloads no artifact and runs nothing built from run
# data, with no secret but the default token and no permission but these two.
name: ci-alerts

on:
  workflow_run:
    # The watched workflows not themselves triggered by workflow_run (those, and missing runs,
    # are reconciled on the schedule). Never this workflow.
    workflows:
      - checks
      - contracts
      - python
      - semantic-corpus
      - web
      - labels
      - release
      - property-nightly
      - ossie-upstream
      - ci-alerts-selftest
    types: [completed]
  schedule:
    - cron: "41 */6 * * *"
  # On main it reconciles everything; from any other branch it is a dry run (prints only).
  workflow_dispatch:

permissions: {}

# One listener run at a time; a dropped pending run is harmless, the next reconciles everything.
concurrency:
  group: ci-alerts
  cancel-in-progress: false

jobs:
  ci-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      # The default branch's reporter, never the triggering run's head. A dispatch runs the
      # dispatched branch's own reporter, as a dry run: only a maintainer can dispatch. The
      # repository is public, so no `contents` permission is needed to read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Reconcile the tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # A dispatch from another branch is a dry run: the script reads this ref.
          GITHUB_REF: ${{ github.ref }}
          # The Agent works through the Owner's account (AGENTS.md §1).
          ASSIGNEE: ${{ github.repository_owner }}
        run: python3 .github/workflows/scripts/ci_alerts.py
