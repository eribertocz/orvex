# Architecture and naming checks (P0-04), standard library only.
name: checks

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels the pull request's older runs (#386). Pushes to one
# branch (main) share a group: a running one is never cancelled, and only the newest waiting
# one is kept, since it tests everything the older ones would (#391).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  product-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m tools.checks.product_name

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m tools.checks.boundaries
      # Every contract error code the product raises has a test (#241).
      - run: python -m tools.checks.error_codes
