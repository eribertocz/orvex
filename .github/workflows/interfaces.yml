# Interface contracts (#486): their record is current and compatible with the last release
# (G3), and a module installs and passes its own tests alone, outside the repository (G4).
name: interfaces

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels the pull request's older runs (#386). Pushes to one
# branch (main) share a group: a running one is never cancelled, and only the newest waiting
# one is kept, since it tests everything the older ones would (#391).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  interface-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and its tags: the check reads the record of the last release.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install from the lock file and the contracts package
        run: |
          python -m pip install --quiet pip==26.3
          python -m pip install --quiet -r pylock.toml
          python -m pip install --quiet --no-deps --no-build-isolation -e packages/contracts
      - name: The interface record is current
        run: python -m tools.contracts.interface_record --check
      - name: Compatible with the last release
        run: python -m tools.contracts.interface_compat

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install the build tools from the lock file
        run: |
          python -m pip install --quiet pip==26.3
          python -m pip install --quiet -r pylock.toml
      - name: The contracts module alone, outside the repository
        run: python -m tools.ci.standalone contracts

  standalone-access:
    runs-on: ubuntu-latest
    # The access store's PostgreSQL tests (#436) run in the clean environment too: a disposable
    # database, not a secret.
    services:
      postgres:
        # postgres:18.6-trixie
        image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: ci-disposable-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ACCESS_TEST_POSTGRES: host=localhost port=5432 dbname=postgres user=postgres
      ACCESS_TEST_POSTGRES_PASSWORD: ci-disposable-database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install the build tools from the lock file
        run: |
          python -m pip install --quiet pip==26.3
          python -m pip install --quiet -r pylock.toml
      - name: The access module alone, outside the repository
        run: python -m tools.ci.standalone access
