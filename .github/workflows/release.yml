# Release (P0-08): a product tag `v*` builds the web application and every wheel (the server wheel
# includes the web build) and publishes them as a GitHub release with SHA256SUMS, a CycloneDX
# SBOM, and signed build provenance and SBOM attestations for every file (#242;
# docs/user/verify-a-release.md). Module tags
# (`<module>-v*`) only mark versions and do not match this trigger.
# `workflow_dispatch` with dry-run (the default) builds and uploads the files as a workflow
# artifact only; nothing is published.
name: release

on:
  push:
    tags: ["v*"]
  # A change to this workflow is built (never published) on its pull request; every pull
  # request gets the `release-build` result (#267).
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build everything and publish nothing
        type: boolean
        default: true

# A newer commit on a pull request cancels the pull request's older runs (#386). Pushes to one
# branch (main) share a group: a running one is never cancelled, and only the newest waiting
# one is kept, since it tests everything the older ones would (#391).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The paths that make this check apply (#267), read by changes.py and aggregate.py.
  RELEVANT_PATHS: |
    .github/workflows/release.yml
    .github/workflows/scripts/sbom_build.py
    .github/workflows/scripts/sbom_check.py
    .github/workflows/scripts/sbom_runtime.py
    vendor/cyclonedx/**
    pylock.toml
    web/package-lock.json

jobs:
  # Whether this run changes a relevant path (#267): `changes.py` fails closed.
  changes:
    name: release-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/workflows/scripts/changes.py

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: The tag equals the product version in versions.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          product=$(python -c "import tomllib; print(tomllib.load(open('versions.toml', 'rb'))['product'])")
          test "$TAG" = "v$product" || { echo "RELEASE_TAG_MISMATCH: tag $TAG, versions.toml v$product"; exit 1; }
      - name: Build the web application
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Put the web build inside the server package
        run: |
          namespace=$(python -c "import tomllib; print(tomllib.load(open('identity.toml', 'rb'))['product']['python_namespace'])")
          cp -r web/build "packages/server/src/${namespace}/server/web"
      - name: Build every wheel
        run: |
          python -m pip install --upgrade pip==26.3
          for package in packages/*/; do
            python -m pip wheel --no-deps --wheel-dir dist "$package"
          done
      - name: Install the lock, whose runtime closure the SBOM lists
        run: python -m pip install --quiet -r pylock.toml
      - name: The SBOM of what the release ships (#242)
        run: python .github/workflows/scripts/sbom_build.py dist "$GITHUB_SHA" "$(git log -1 --format=%cI)"
      - name: The SBOM is valid and complete
        run: python .github/workflows/scripts/sbom_check.py dist
      - name: Check the server wheel contains the web build and its license notices
        # A block scalar: the script's ": " would end a plain YAML value (#197).
        shell: python
        run: |
          import glob, sys, zipfile
          names = [n for w in glob.glob("dist/*.whl") for n in zipfile.ZipFile(w).namelist()]
          wanted = ("index.html", "THIRD_PARTY_LICENSES.md")
          missing = [f for f in wanted if not any(n.endswith("/server/web/" + f) for n in names)]
          sys.exit("missing from the server wheel: " + ", ".join(missing) if missing else 0)
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.whl *.cdx.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Publishes only for a product tag: pushed, or dispatched on a tag with dry-run turned off.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    # The only job that may sign (#242): a Sigstore certificate for this workflow and commit.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - id: sbom
        run: echo "path=$(ls dist/*.cdx.json)" >> "$GITHUB_OUTPUT"
      - name: Signed build provenance for every wheel and the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.cdx.json
      - name: The SBOM attested for every wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: ${{ steps.sbom.outputs.path }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          verify="Verify these files before installing them: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/user/verify-a-release.md"
          # The release may already exist when the tag was created by publishing it on GitHub;
          # then the files are attached to it, and its notes gain the verification link.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            case "$notes" in *verify-a-release.md*) ;; *) notes="$verify

          $notes" ;; esac
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease="$prerelease" --notes "$notes"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "$verify" --generate-notes --prerelease="$prerelease"
          fi

  # The required result (#267): passes when build ran and passed, reports "Not applicable"
  # only when `changes` proved nothing relevant changed, and fails otherwise.
  release-build:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/workflows/scripts/aggregate.py
        env:
          CHECK: release-build
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULT: ${{ needs.build.result }}
