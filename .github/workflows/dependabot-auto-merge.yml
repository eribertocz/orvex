# Tier C (git-workflow.md §3.5): Dependabot patch and minor updates of Python and npm packages
# merge by themselves once every required check passes. The decision is in
# scripts/dependabot_decision.py; anything else is left for review.
name: dependabot-auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    # Only Dependabot's own pull requests, opened from a branch of this repository (never a fork).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The script comes from the base commit: this job holds a write token, so it never runs
      # code from the pull request's branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide
        id: decision
        working-directory: .github/workflows/scripts
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 dependabot_decision.py
      - name: Enable auto-merge
        if: steps.decision.outputs.merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
