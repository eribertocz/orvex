# Tests of the repository automation scripts, run on the pull request's own code.
name: governance-scripts

on:
  pull_request:

permissions:
  contents: read

jobs:
  governance-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the repository automation scripts
        working-directory: .github/workflows/scripts
        run: python3 -m unittest discover -p 'test_*.py' -v
