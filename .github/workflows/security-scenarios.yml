# The security scenarios as a gate (P3-13, #447): every normative security case, on every engine
# it lists, through the security runner (`conformance/runners/security_scenarios.py`): the managed
# lake, an existing DuckLake on SQLite and on PostgreSQL catalogs, and ClickHouse on each tested
# version, the latest stable (26.10, the service) and the current LTS (26.8, run from its
# release archive, checked by its SHA-512). Fails on any failed, stale or missing execution; the
# JSON report is the P3 exit's evidence (git-workflow.md §6). Scoped (#267): it applies when
# anything the cases exercise changes, and always on main.
name: security-scenarios

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on a pull request cancels the pull request's older runs (#386). Pushes to one
# branch (main) share a group: a running one is never cancelled, and only the newest waiting
# one is kept, since it tests everything the older ones would (#391).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The paths that make this check apply (#267), read by changes.py and aggregate.py: the code
  # the cases run on, their contracts, the cases and the runner, and the dependencies.
  RELEVANT_PATHS: |
    .github/workflows/security-scenarios.yml
    packages/**
    contracts/**
    conformance/**
    pylock.toml
    pyproject.toml

jobs:
  # Whether this run changes a relevant path (#267): `changes.py` fails closed.
  changes:
    name: security-scenarios-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/workflows/scripts/changes.py

  scenarios:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # ClickHouse 26.10; a disposable server, not a secret. Each case creates its own database
      # and reader, and drops them.
      clickhouse:
        # clickhouse/clickhouse-server:26.10.2.103, the image of python.yml's service
        image: clickhouse/clickhouse-server@sha256:b2bfa4d8399ee9973868cc5c1754cb506a6f4b86fbddc41010cc090beb55c85e
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci-disposable-database
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user ci --password ci-disposable-database --query 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 60
      # The existing lake's PostgreSQL catalog; a disposable database, not a secret. Each case
      # creates its own database, owner role and reader role, and drops them.
      postgres:
        # postgres:18.6-trixie, the image of python.yml's service
        image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: ci-disposable-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install from the lock file and the workspace packages
        run: |
          python -m pip install --quiet pip==26.3
          python -m pip install --quiet -r pylock.toml
          for package in packages/*/; do
            python -m pip install --quiet --no-deps --no-build-isolation -e "$package"
          done
      - name: Start ClickHouse 26.8 LTS from its release archive
        # The official static build, checked against its pinned SHA-512 before it runs; on port
        # 8124 beside the 26.10 service, its own data in the runner's temporary folder.
        run: |
          version=26.8.30.8
          archive="clickhouse-common-static-$version-amd64.tgz"
          dir="$RUNNER_TEMP/clickhouse-$version"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -o "$archive" \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$version-lts/$archive"
          echo "36ae5d4629a19480a009aa278c8625aa3d01935b09c4a3ee3163700e895fc6b53d92f286cf01b90461cc63de0bd45e452153e90ddee61a0fe18f6287c6c7e575  $archive" | sha512sum -c -
          tar -xzf "$archive"
          mkdir data
          cd data
          nohup "../clickhouse-common-static-$version/usr/bin/clickhouse" server -- \
            --http_port=8124 --tcp_port=9100 --mysql_port=9104 --postgresql_port=9105 \
            --interserver_http_port=9109 --logger.level=warning > ../server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8124/ping && exit 0
            sleep 1
          done
          cat ../server.log
          exit 1
      - name: Every scenario on every engine, both ClickHouse versions required
        run: >-
          python -m conformance.runners.security_scenarios
          --clickhouse localhost:8123:ci:CLICKHOUSE_26_10_PASSWORD
          --clickhouse localhost:8124:default
          --require-clickhouse 26.10,26.8
          --json security-scenarios.json
        env:
          STORE_TEST_POSTGRES: host=localhost port=5432 dbname=postgres user=postgres
          STORE_TEST_POSTGRES_PASSWORD: ci-disposable-database
          CLICKHOUSE_26_10_PASSWORD: ci-disposable-database
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-scenarios-report
          path: security-scenarios.json
          if-no-files-found: error

  # The required result (#267): passes when the scenarios ran and passed, reports "Not
  # applicable" only when `changes` proved nothing relevant changed, and fails otherwise.
  security-scenarios:
    needs: [changes, scenarios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/workflows/scripts/aggregate.py
        env:
          CHECK: security-scenarios
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULT: ${{ needs.scenarios.result }}
