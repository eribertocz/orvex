openapi: 3.1.0
info:
  title: HTTP API
  version: 1.0.0
  description: >-
    Public HTTP API served by the `server` module. Every non-2xx response uses ErrorEnvelope and
    every response carries an X-Request-Id header. Later issues extend this contract compatibly.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: The server is running.
      responses:
        "200":
          description: The server is running.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Product, module and contract versions.
      responses:
        "200":
          description: Versions of the running product.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/semantic/query:
    post:
      operationId: postSemanticQuery
      summary: Answer a semantic question for the caller (local mode, P2-27a; server mode, #445).
      description: >-
        The body is a `semantic-query` v1 document. The caller is authenticated by the serve
        session (a session cookie or `Authorization: Bearer`) in local mode, by the server
        session in server mode, where only a Builder or an Author asks (see `README.md`). With
        `Prefer: respond-async` (RFC 7240) the question runs as a job: `202`, its `Location`
        is `/api/v1/semantic/jobs/{job}`. A next detail
        page is answered on the snapshot its cursor pins, never on the current one. With
        `Accept: application/vnd.apache.arrow.stream` the answer is the result's Arrow form
        (`semantic-result` v1), whose schema metadata also holds `semantic.envelope` (the JSON
        form's envelope) and `semantic.receipt` (the receipt view), both as RFC 8785 bytes
        equal to the JSON answer's.
      security: [{ session: [] }, { bearer: [] }, { serverSession: [] }]
      parameters:
        - name: Prefer
          in: header
          required: false
          description: "`respond-async`: run the question as a job (#445)."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-contract: semantic-query/v1, description: "A semantic-query v1 document." }
      responses:
        "200":
          description: The result and the caller's view of its receipt.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticAnswer" }
            application/vnd.apache.arrow.stream:
              schema: { type: string, format: binary }
        "202":
          description: The job started for the caller; nothing of its answer yet.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location:
              description: The job's status resource.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticJob" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/semantic/jobs/{job}:
    get:
      operationId: getSemanticJob
      summary: An asynchronous question's status, or its answer once done (#445).
      description: >-
        Only the job's owner (its user, in its project) finds it; anyone else, an unknown id
        and a job past its 10 minutes get `404 SEMANTIC_JOB_NOT_FOUND` alike. A done job's
        answer is delivered under the caller's permissions now: permissions changed since it
        ran give `409 QUERY_RESULT_WITHDRAWN`, and nothing of the answer is sent. A failed job
        gives the error the synchronous question would.
      parameters:
        - name: job
          in: path
          required: true
          description: The job's id, 32 hexadecimal digits.
          schema: { type: string }
      security: [{ session: [] }, { bearer: [] }, { serverSession: [] }]
      responses:
        "200":
          description: >-
            `running` or `cancelled` with no answer, or `done` with it; with `Accept:
            application/vnd.apache.arrow.stream`, a done job's answer is its Arrow form.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticJob" }
            application/vnd.apache.arrow.stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSemanticJob
      summary: Cancel an asynchronous question (#445).
      description: >-
        The job ends `cancelled` at once and its slot is free; its running read is interrupted
        and its answer is never delivered. A cancel of an ended job changes nothing.
      parameters:
        - name: job
          in: path
          required: true
          description: The job's id, 32 hexadecimal digits.
          schema: { type: string }
      security: [{ session: [] }, { bearer: [] }, { serverSession: [] }]
      responses:
        "200":
          description: The job's status after the cancel.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticJob" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/semantic/explain:
    post:
      operationId: postSemanticExplain
      summary: What the engine would do with a question, and why, with no data read (P2-27b).
      description: >-
        The same body, session, caller and snapshot rules as `query`. Errors of category
        `query` or `security` (an invalid query, an unknown or hidden member, a masked member,
        a cursor) are sent as errors, as `query` sends them; the plan's own refusals (category
        `correctness`, `budget` or `engine`) answer 200 with `outcome: refused`.
      security: [{ session: [] }, { bearer: [] }, { serverSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { x-contract: semantic-query/v1, description: "A semantic-query v1 document." }
      responses:
        "200":
          description: The caller's `semantic-explain` v1 document.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { x-contract: semantic-explain/v1, description: "A semantic-explain v1 document." }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/semantic/catalog:
    get:
      operationId: getSemanticCatalog
      summary: The members the caller may see (local mode, P2-27a; server mode, #445).
      security: [{ session: [] }, { bearer: [] }, { serverSession: [] }]
      responses:
        "200":
          description: The caller's `catalog` v1 document; hidden members are never listed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { x-contract: catalog/v1, description: "A catalog v1 document." }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: postSignIn
      summary: Sign in with a user name and a password (server mode, #438).
      description: >-
        Issues a new session in the `__Host-<slug>_session` cookie (`HttpOnly`, `Secure`,
        `SameSite=Strict`, `Path=/`) and ends the one the browser sent, if any. A wrong password
        and an unknown user get the same `LOGIN_FAILED`, in content and in time. After failed
        sign-ins the account and the address wait a growing delay (`LOGIN_DELAYED`, with
        `Retry-After`). A session opened with a temporary password may only change it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignIn" }
      responses:
        "200":
          description: Signed in; the session is in the cookie only.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: The caller's live session (server mode, #438).
      security: [{ serverSession: [] }]
      responses:
        "200":
          description: The session is live; its user as they are now.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: postSignOut
      summary: End the caller's session (server mode, #438).
      security: [{ serverSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "204":
          description: The session has ended and the cookie is cleared.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      operationId: postPasswordChange
      summary: Change the caller's own password (server mode, #438).
      description: >-
        Every session of the user ends, and the one that made the change gets a new id in the
        cookie. The current password is checked under the same delay as a sign-in.
      security: [{ serverSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Changed; the session's new id is in the cookie.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { schema: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/{provider}/start:
    get:
      operationId: getOidcStart
      summary: Begin an OIDC sign-in with a configured provider (server mode, #439).
      description: >-
        Redirects to the provider (Authorization Code with PKCE S256, `response_mode=query`) and
        sets the binding cookie `__Secure-<slug>_oidc` (`HttpOnly`, `Secure`, `SameSite=Lax`,
        `Path=/api/v1/auth/oidc`, at most 10 minutes). With `refresh=true`, the silent
        re-authentication (`prompt=none`) of the caller's live provider session.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" } }
        - { name: refresh, in: query, required: false, schema: { type: string, enum: ["true"] } }
      responses:
        "303":
          description: To the provider's authorization endpoint.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
        "400":
          description: The generic `OIDC_FAILED` page (text/html).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/oidc/{provider}/callback:
    get:
      operationId: getOidcCallback
      summary: Finish an OIDC sign-in (server mode, #439).
      description: >-
        Checks the binding, the authorization response, the token exchange and the ID token,
        then sets the session cookie (#438) and answers a page that opens `/`. Every failure is
        the one generic `OIDC_FAILED` page; the audit log names the step.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" } }
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, required: false, schema: { type: string, maxLength: 4096 } }
      responses:
        "200":
          description: Signed in (text/html); the session is in the cookie only.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Set-Cookie: { schema: { type: string } }
        "400":
          description: The generic `OIDC_FAILED` page (text/html).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: "<slug>_session_<port>"
      description: >-
        A session cookie issued by exchanging the serve session's one-time bootstrap code
        (`/?code=…`); `HttpOnly`, `SameSite=Strict`.
    serverSession:
      type: apiKey
      in: cookie
      name: "__Host-<slug>_session"
      description: >-
        Server mode's session (#438): `HttpOnly`, `Secure`, `SameSite=Strict`, `Path=/`. Every
        `POST`, `PUT`, `PATCH` or `DELETE` must also carry the instance's public origin in
        `Origin`, `Sec-Fetch-Site: same-origin` when the browser sends that header, and an
        `application/json` body.
    bearer:
      type: http
      scheme: bearer
      description: The serve session's token for scripts, read from its owner-only token file.
  x-error-codes:
    # Registry of the codes the server sends in ErrorEnvelope.error.code. Adding a code is a
    # compatible change; removing one or changing its meaning requires v2 and an ADR.
    NOT_FOUND: No route or resource matches the request.
    METHOD_NOT_ALLOWED: >-
      The route exists but does not accept this HTTP method; the `Allow` header lists the
      methods it accepts.
    HOST_NOT_ALLOWED: >-
      The request's `Host` does not name this server; in local mode only `127.0.0.1:<port>` and
      `localhost:<port>` are answered (DNS-rebinding protection).
    ORIGIN_NOT_ALLOWED: >-
      A browser sent the request from another site: its `Origin` is not this server's own.
    VALIDATION_FAILED: The request does not match the contract; `details` names each problem.
    INTERNAL_ERROR: An unexpected server failure; the request id identifies it in the server log.
    UNAUTHENTICATED: >-
      A semantic route was asked without a live session cookie or the session's bearer token,
      or a bootstrap code that is spent, expired or wrong was presented.
    UNSUPPORTED_MEDIA_TYPE: A semantic `POST` whose body is not `application/json`.
    SEMANTIC_JOB_NOT_FOUND: >-
      No asynchronous job with this id for this caller: unknown, expired (kept 10 minutes),
      lost in a restart, or another caller's (#445).
    PROJECT_BUSY: >-
      A run holds the project's lake; the `Retry-After` header says when to try again.
    PROJECT_INVALID: The project's settings (`project.yaml`) have problems.
    LAKE_NOT_FOUND: The project has no lake yet; it has never been run.
    SEMANTIC_MODEL_NOT_FOUND: The project has no semantic model.
    SEMANTIC_MODEL_INVALID: >-
      The project's semantic model or its policies have problems; `details` names each one.
    PAGE_FORBIDDEN: >-
      The caller may not see this page, or a page-bound query asks for something its published
      visual does not declare (`security.md` §3.2; reserved until P6-07).
    PAGE_CHANGED: >-
      The page was published again after the caller opened it; the caller reopens it (#435,
      Owner 2026-11-10; reserved until P6-07).
    EXPORT_FORBIDDEN: >-
      A Viewer asked to export where the dashboard's `export.viewers` is `false` (reserved until
      P6-18).
    MCP_FORBIDDEN: >-
      A Viewer called an MCP tool where the project's `mcp.viewers` is `false` (reserved until
      P9-03).
    ACCESS_FORBIDDEN: >-
      The caller may not perform this administration operation (#436). The message never says
      which rule refused it.
    LAST_BUILDER: The change would leave a project without an active Builder (#436).
    LAST_ADMINISTRATOR: The change would leave the instance without an active administrator (#436).
    USER_NAME_TAKEN: Another user already has this user name, compared without regard to case (#436).
    AUDIT_UNAVAILABLE: >-
      The action's audit event could not be recorded, so the action did not happen and no result
      was delivered (#437).
    LOGIN_FAILED: >-
      The user name or the password is wrong (#438). An unknown user, a deactivated user and an
      expired temporary password get this same answer.
    LOGIN_DELAYED: >-
      Earlier failed sign-ins set a delay for this account or address; `Retry-After` says when to
      try again (#438). The answer is the same for every account.
    PASSWORD_REJECTED: >-
      A new password has fewer than 12 or more than 1,024 characters, or is the user name (#438).
    SESSION_EXPIRED: >-
      There is no live session: it ended, expired or never existed, and the answer never says
      which (#438).
    PASSWORD_CHANGE_REQUIRED: >-
      The session was opened with a temporary password; it may only change it (#438).
    ORIGIN_REFUSED: >-
      A state-changing request in server mode without the instance's public origin in `Origin`,
      sent from another site (`Sec-Fetch-Site`), or without an `application/json` body (#438).
    OIDC_FAILED: >-
      An OIDC sign-in failed at some step; the browser is never told which (#439). The audit log
      names it.
    OIDC_NOT_CONFIGURED: >-
      No such sign-in provider, or the instance's sign-in configuration is not complete (#439).
    OIDC_REFRESH_REQUIRED: >-
      The session's provider groups are due to be read again: open
      `/api/v1/auth/oidc/{provider}/start?refresh=true` for a silent re-authentication. If it
      fails, the session ends (#439).
  headers:
    RequestId:
      description: >-
        Identifier of the request, also written to the server log. On error responses it equals
        `error.request_id` in the body.
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Any error. The body is always an ErrorEnvelope.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    SemanticVersion:
      type: string
      description: Semantic Versioning 2.0.0 (official regular expression from semver.org).
      pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
    ModuleVersion:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
        version: { $ref: "#/components/schemas/SemanticVersion" }
    ContractVersion:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
        version: { type: string, pattern: "^v[1-9][0-9]*$" }
    Version:
      type: object
      additionalProperties: false
      required: [product, modules, contracts]
      properties:
        product: { $ref: "#/components/schemas/SemanticVersion" }
        modules: { type: array, items: { $ref: "#/components/schemas/ModuleVersion" } }
        contracts: { type: array, items: { $ref: "#/components/schemas/ContractVersion" } }
    SignIn:
      type: object
      additionalProperties: false
      required: [user_name, password]
      properties:
        user_name: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 1, maxLength: 4096 }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 4096 }
        new_password: { type: string, minLength: 1, maxLength: 4096 }
    SessionView:
      type: object
      additionalProperties: false
      required: [user, password_change_required]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, user_name, display_name, administrator]
          properties:
            id: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
            user_name: { type: string, minLength: 1 }
            display_name: { type: string, minLength: 1 }
            administrator: { type: boolean }
        password_change_required: { type: boolean }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string, minLength: 1 }
        value: { type: string }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          description: >-
            Stable, machine-readable error code. Every code the server sends is listed in
            `components.x-error-codes` with its meaning.
          type: string
          pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
        message: { type: string, minLength: 1 }
        details: { type: array, items: { $ref: "#/components/schemas/ErrorDetail" } }
        request_id: { type: string, minLength: 1 }
        semantic:
          description: The engine's whole `semantic-error` v1 message, for an engine error.
          x-contract: semantic-error/v1
    SemanticAnswer:
      type: object
      additionalProperties: false
      required: [result, receipt]
      properties:
        result: { x-contract: semantic-result/v1, description: "The result's JSON form." }
        receipt: { x-contract: receipt/v1, description: "The caller's view of its receipt." }
    SemanticJob:
      type: object
      additionalProperties: false
      required: [job, status]
      properties:
        job: { type: string, pattern: "^[0-9a-f]{32}$" }
        status: { type: string, enum: [running, done, cancelled] }
        answer: { $ref: "#/components/schemas/SemanticAnswer" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
