# The mandatory checks, in one place (#240, #261). `tools/ci/verify.py` reads this list and
# runs every check it can; CI runs the same checks in the workflows named here. A test
# (tests/tools/test_ci_checks.py) fails when a workflow job that pull requests run is missing
# here, or when a job's `run` steps differ from its checks and setup steps below (each step is
# named by its first line).
#
# [[job]]: workflow, job, kind, setup (first lines of the steps that prepare the job), and
#   `pythons` when the job runs on a matrix of Python versions. Kinds:
#   "check": runs on every pull request; "scoped": runs only when its `paths` change, gated by
#   its workflow's `changes` job and reported by an aggregator (#267), and the local
#   verification does not run it (its `reason` says why); "automation": acts on the
#   repository and checks nothing.
#   `required` marks a job whose status-check names (`contexts`) main's protection requires;
#   the drift test refuses every way such a job could be skipped, and tools/ci/protection.py
#   compares the required names with main's rulesets and branch protection. `conditions` lists
#   step conditions allowed in a required job or a job it needs, each with its reason;
#   `permissions` lists a job's permissions when they are not read-only; `reports` lists the
#   trailing steps that run only on a failure (`if: failure()`) and check nothing.
#   A check job also records `digest`, a digest of the whole job in its workflow: when the job
#   changes in any way, the drift test fails until its entries here are compared with it again
#   and the digest updated (`python -m tools.ci.checks` prints the new one).
# [[job.check]]: name, run (the step's first line), directory (the step's working directory,
#   when not the repository root), and `local`: true when the local full verification runs
#   it; false with the `reason` it can run only in CI.

# Profiles (#375, #373 §2), run by `python -m tools.ci.verify <profile>`:
# - `fast`: while working: the quick checks and the tests of the changed packages;
# - `pr`: locally before a push: the quick checks, the critical checks and tests below, and the
#   tests the change affects (`tools/ci/impact.py`), in parallel parts;
# - `full`: the whole suite on every Python of the matrix: required in CI on every pull request
#   before a merge, and the local run for a tier A pull request before it is marked ready;
# - `nightly`: the extensive runs, on a schedule (`property-nightly.yml`); never blocks a merge.
# The critical sets run in `pr` and `full` whatever a change touches.
#
# A failing nightly run opens or updates one tracking issue (`property-nightly.yml`, #377),
# triaged in the next session. A security, exactness, contract or corpus failure is fixed for
# its class, and its shrunk counterexample is committed as a regression test (`@example` on the
# property, or a plain test) in a file listed in `regressions`: each of those files is in a
# critical set, so `pr` and `full` run it, never only `nightly` (tests/tools/test_verify.py).
[profiles]
critical_checks = ["semantic-corpus", "contracts-validate", "governance-scripts", "boundaries", "product-name"]
critical_tests = [
  # Security: access, contexts and policies, the HTTP boundary, source isolation.
  "packages/access/tests",
  "packages/semantic/tests/test_policies.py",
  "packages/server/tests/test_semantic_http.py",
  "packages/store/tests/test_source_isolation.py",
  "tests/conformance/test_row_policies.py",
  "tests/conformance/test_security_context_reuse.py",
  "tests/conformance/test_direct_query.py",
  # Exactness and the semantic engine's contract with its corpus.
  "tests/conformance/test_semantic_corpus.py",
  "tests/conformance/test_execution.py",
  "tests/conformance/test_exact_arithmetic.py",
  "tests/properties",
  # Contracts and their examples.
  "tests/contracts",
]
# The source the critical tests protect: security (access, policies, source isolation and the
# SQL guard) and exactness (the compiler, correctness, the engine adapters and exact values).
# Each Python file under these paths has a branch-coverage floor in coverage-floor.toml (#429).
critical_sources = [
  "packages/access/src/orvex/access",
  "packages/semantic/src/orvex/semantic/policies",
  "packages/semantic/src/orvex/semantic/compiler",
  "packages/semantic/src/orvex/semantic/correctness",
  "packages/semantic/src/orvex/semantic/adapters",
  "packages/store/src/orvex/store/arrow_exact.py",
  "packages/store/src/orvex/store/isolation.py",
  "packages/store/src/orvex/store/separation.py",
  "packages/store/src/orvex/store/source_exactness.py",
  "packages/store/src/orvex/store/sql_guard.py",
]
# The files that hold committed nightly counterexamples (`@example`).
regressions = [
  "tests/properties/test_binder_properties.py",
  "tests/properties/test_engine_oracle.py",
  "tests/properties/test_exact_properties.py",
  "tests/properties/test_multifact_materialization.py",
  "tests/properties/test_policy_properties.py",
]

