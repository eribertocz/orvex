# License allow-list (docs/process/engineering.md §5). SPDX identifiers.
# Runtime: code that ships with the product (Python runtime dependencies, npm `dependencies`).
# Development: tools that never ship (Python dev group, npm `devDependencies`); also allow every
# runtime license.

runtime = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "PSF-2.0"]
development = ["MPL-2.0", "MIT-0", "BlueOak-1.0.0", "CC0-1.0", "Python-2.0"]

# Per-package exceptions: package name -> reason. Each needs an issue or ADR reference.
[exceptions]
cffi = "#346: MIT-0, MIT without its attribution clause, so more permissive than an allowed runtime license; a runtime dependency of cryptography (page cursors)"
