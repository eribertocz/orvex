# Readers other than DuckDB allowed in `store` and `transform` (engineering.md §2, #261).
# Each entry allows one reader inside one function (and the module-level import of that
# reader), says why no source row is read or materialized in Python, and names the test, in a
# tests folder, that proves it stays within that reason.
# [[allow]]
# file = "packages/<module>/src/<namespace>/<module>/<file>.py"
# reader = "sqlite3"
# function = "<function>"
# reason = "what it reads, and why no source row goes through Python"
# test = "packages/<module>/tests/test_<x>.py::test_<name>"

[[allow]]
file = "packages/store/src/orvex/store/sqlite_copy.py"
reader = "sqlite3"
function = "sqlite_backup"
reason = "The SQLite snapshot copy (#83): the backup API copies the file page by page, running no statement on it; DuckDB reads every row from the copy, in the source's worker (#372)"
test = "packages/store/tests/test_database_sources.py::test_the_sqlite_copy_reads_only_schema_names_in_python"

[[allow]]
file = "packages/store/src/orvex/store/sqlite_copy.py"
reader = "sqlite3"
function = "_sqlite_copy"
reason = "In the source's worker (#372): Python reads only schema names (tables, column types) of the copy, to find inexact columns; DuckDB reads every row"
test = "packages/store/tests/test_database_sources.py::test_the_sqlite_copy_reads_only_schema_names_in_python"

[[allow]]
file = "packages/store/src/orvex/store/source_worker.py"
reader = "pyarrow.ipc.open_stream"
function = "open"
reason = "The source isolation boundary (#372): the worker's Arrow IPC stream, handed to DuckDB batch by batch as a registered stream; Arrow carries the rows as transport (engineering.md §2), DuckDB reads them, and no row becomes a Python object"
test = "packages/store/tests/test_source_isolation.py::test_streaming_stays_bounded_by_the_batch"

[[allow]]
file = "packages/transform/src/orvex/transform/models.py"
reader = "os.open"
function = "_read_sql"
reason = "Reads one model's SQL text from the project, never a data source: a regular file only, at most 1024 KiB"
test = "packages/transform/tests/test_models.py::test_a_pipe_named_sql_does_not_hang"

[[allow]]
file = "packages/transform/src/orvex/transform/models.py"
reader = "os.fdopen"
function = "_read_sql"
reason = "The descriptor `os.open` returned in the same function, read with the 1024 KiB bound"
test = "packages/transform/tests/test_models.py::test_a_pipe_named_sql_does_not_hang"

[[allow]]
file = "packages/transform/src/orvex/transform/config_file.py"
reader = "os.open"
function = "__init__"
reason = "Reads one project YAML file (project.yaml, connections.yaml, a model's sidecar), never a data source: a regular file only, at most 1 MiB"
test = "packages/transform/tests/test_config_file.py::test_a_config_file_reader_reads_only_a_bounded_regular_file"

[[allow]]
file = "packages/transform/src/orvex/transform/config_file.py"
reader = "os.fdopen"
function = "__init__"
reason = "The descriptor `os.open` returned in the same function, read with the 1 MiB bound"
test = "packages/transform/tests/test_config_file.py::test_a_config_file_reader_reads_only_a_bounded_regular_file"

[[allow]]
file = "packages/store/src/orvex/store/clickhouse.py"
reader = "pyarrow.ipc.open_stream"
function = "read"
reason = "ClickHouse Direct Query (ADR-0027 §8, ADR-0028 §3): the result of a statement ClickHouse ran, in its own Arrow stream; Arrow carries it as transport, each batch is cast column by column, and no row becomes a Python object. No source row is extracted into the lake"
test = "packages/store/tests/test_clickhouse.py::test_no_row_becomes_a_python_object_in_the_read"

[[allow]]
file = "packages/store/src/orvex/store/existing_lake.py"
reader = "os.open"
function = "_open_no_follow"
reason = "An existing lake's SQLite catalog files (ADR-0027 §3), opened with O_NOFOLLOW for their device and inode and the header's journal mode only; no row is read. DuckDB attaches the catalog"
test = "packages/store/tests/test_existing_lake.py::test_a_catalog_that_is_a_symbolic_link_is_refused"

[[allow]]
file = "packages/store/src/orvex/store/separation.py"
reader = "os.open"
function = "_open"
reason = "An existing lake's snapshot files (ADR-0027 §3, #399 PR 2), opened from the data folder one component at a time with O_NOFOLLOW for their type, device and inode only; no byte is read. DuckDB reads the files"
test = "packages/store/tests/test_existing_lake_files.py::test_a_snapshot_reaching_a_file_through_a_symbolic_link_is_not_served"

[[allow]]
file = "packages/store/src/orvex/store/separation.py"
reader = "read_text"
function = "_mounts"
reason = "Linux's mount table (/proc/self/mountinfo), for the devices under a protected location (ADR-0027 §3, #399 PR 2); not a source"
test = "packages/store/tests/test_existing_lake_files.py::test_a_local_data_location_on_a_file_system_holding_a_protected_location_is_refused"
