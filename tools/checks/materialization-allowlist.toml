# Calls that read rows into Python, allowed in product code only with a reason (ADR-0025).
# [[allow]]
# file = "packages/<module>/src/<namespace>/<module>/<file>.py"
# call = "fetchall"
# reason = "why this result is small and bounded"

[[allow]]
file = "packages/server/src/orvex/server/instance.py"
call = "fetchone"
reason = "SQLite project registry (module state, not analytical data): one row per lookup"

[[allow]]
file = "packages/server/src/orvex/server/instance.py"
call = "fetchall"
reason = "SQLite project registry (module state, not analytical data): the list of registered projects"

[[allow]]
file = "packages/store/src/orvex/store/lake.py"
call = "fetchone"
reason = "Lake metadata and SQL rewriting: one snapshot row or one serialized statement, never data rows"

[[allow]]
file = "packages/transform/src/orvex/transform/graph.py"
call = "fetchone"
reason = "SQL parsing on a data-less connection: one serialized or rewritten statement, never data rows"

[[allow]]
file = "packages/transform/src/orvex/transform/reconciliation.py"
call = "fetchone"
reason = "Expression parsing on a data-less connection: one serialized or rendered expression, never data rows"

[[allow]]
file = "packages/transform/src/orvex/transform/lineage.py"
call = "fetchall"
reason = "The catalog of aggregate function names on a data-less connection, never data rows"

[[allow]]
file = "packages/transform/src/orvex/transform/auto_filter.py"
call = "fetchone"
reason = "SQL parsing and rendering on a data-less connection: one serialized or rendered statement, never data rows"

[[allow]]
file = "packages/transform/src/orvex/transform/auto_filter.py"
call = "fetchall"
reason = "The catalog of aggregate function names on a data-less connection, never data rows"

[[allow]]
file = "packages/store/src/orvex/store/json_encoding.py"
call = "to_pylist"
reason = "ResultJson encoding streams one record batch at a time (arrow_to_json reads its reader batch by batch and yields text): at most the read's batch_size rows are Python values at once"

[[allow]]
file = "packages/server/src/orvex/server/commands.py"
call = "to_pylist"
reason = "Run metadata, not analytical data: _column reads one watermark (one row per model in _meta.watermarks, or one max() row); runs reads at most --limit runs (LIMIT $p_limit in the SQL, default 20)"

[[allow]]
file = "packages/server/src/orvex/server/commands.py"
call = "as_py"
reason = "_count reads one count(*) value"

[[allow]]
file = "packages/server/src/orvex/server/maintenance.py"
call = "to_pylist"
reason = "Maintenance records: last_maintenance reads one aggregate row; history reads at most --limit rows (LIMIT $p_limit in the SQL, default 20)"

[[allow]]
file = "packages/server/src/orvex/server/scheduler.py"
call = "to_pylist"
reason = "Run records: one row per model of the project (model_history_request groups by model) and one aggregate row for the last run"
