[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-transform"
version = "0.1.0"
description = "Turn sources into tested tables: SQL models, incremental loads, write-audit-publish."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "duckdb==2.0.0",
  "orvex-contracts==0.1.0",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "tzdata==2026.5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.transform" = ["py.typed", "contracts.toml"]
