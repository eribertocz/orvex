[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant-transform"
version = "0.0.0"
description = "Turn sources into tested tables: SQL models, incremental loads, write-audit-publish."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"sextant.transform" = ["py.typed", "contracts.toml"]
