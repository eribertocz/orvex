[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant-mcp"
version = "0.0.0"
description = "Expose the semantic model to AI agents through the Model Context Protocol."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"sextant.mcp" = ["py.typed", "contracts.toml"]
