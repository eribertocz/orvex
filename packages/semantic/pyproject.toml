[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-semantic"
version = "0.1.0"
description = "Turn business meaning into correct results, or stable errors, with receipts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["cryptography==50.0.2", "orvex-contracts==0.2.0", "jsonschema==4.26.0", "pyarrow==26.0.0", "pyyaml==6.0.3", "tzdata==2026.6"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.semantic" = ["py.typed", "contracts.toml"]
"orvex.semantic.ossie" = ["ossie-extensions-v1.json", "revisions/*/*"]
"orvex.semantic.compiler" = ["registries/*"]
"orvex.semantic.query" = ["semantic-query-v1.json"]
"orvex.semantic.catalog" = ["catalog-v1.json"]
"orvex.semantic.policies" = ["security-policies-v1.json"]
"orvex.semantic.receipt" = ["receipt-v1.json"]
"orvex.semantic.result" = ["semantic-result-v1.json"]
