# The manifest of this module (#486 §2.5, orvex.contracts.manifest): it provides the store
# interface contract in full and requires none.
module = "store"

[dependencies]
runtime = ["duckdb", "orvex-contracts", "pyarrow"]
tests = ["hypothesis", "moto", "pytest"]

[[provides]]
contract = "store"
version = "1.0"
capabilities = ["lake", "read", "write", "maintenance", "existing-lake", "clickhouse", "encoding", "separation"]
implementation = "Store"
