[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-testing"
version = "0.3.0"
description = "Test helpers shared by the modules' and the repository's tests; never shipped."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.testing" = ["py.typed"]
