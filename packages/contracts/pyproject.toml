[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-contracts"
version = "0.1.0"
description = "Types generated from the language-neutral contracts in contracts/. Never edited by hand."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pydantic==2.14.1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.contracts" = ["py.typed", "contracts.toml"]
