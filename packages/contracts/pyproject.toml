[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-contracts"
version = "0.3.0"
description = "The contracts every module may import: generated contract types and the interface-contract format."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pyarrow==26.0.1", "pydantic==2.14.3", "pydantic-core==2.50.4", "pyyaml==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.contracts" = ["py.typed", "contracts.toml", "module.toml", "*/v*_data/*.json", "*/v*_data/*/*.json"]
