# The manifest of this module (#486 §2.5, orvex.contracts.manifest): it implements no interface
# contract and requires none; the contract types depend on pydantic, Arrow tables on pyarrow, and
# aware datetimes parsed by pydantic on its `TzInfo` (pydantic-core).
module = "contracts"

[dependencies]
runtime = ["pyarrow", "pydantic", "pydantic-core"]
tests = ["pytest"]
