# The manifest of this module (#486 §2.5, orvex.contracts.manifest): it implements no interface
# contract and requires none; the contract types depend on pydantic, Arrow tables on pyarrow,
# aware datetimes parsed by pydantic on its `TzInfo` (pydantic-core), and the configuration-file
# reader on pyyaml.
module = "contracts"

[dependencies]
runtime = ["pyarrow", "pydantic", "pydantic-core", "pyyaml"]
tests = ["pytest"]
