[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex-access"
version = "0.0.0"
description = "Know who the caller is and what they may do: users, sessions, roles, audit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.access" = ["py.typed", "contracts.toml"]
