[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant"
version = "0.0.0"
description = "Compose the modules; serve the HTTP API, the CLI and the web application."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[project.scripts]
sextant = "sextant.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"sextant.server" = ["py.typed", "identity.toml"]
