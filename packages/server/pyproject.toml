[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orvex"
version = "0.1.0"
description = "Compose the modules; serve the HTTP API, the CLI and the web application."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "orvex-contracts==0.1.0",
  "orvex-store==0.1.0",
  "orvex-transform==0.1.0",
  "pyyaml==6.0.3",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
]

[project.scripts]
orvex = "orvex.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"orvex.server" = ["py.typed", "contracts.toml", "identity.toml", "versions.toml", "web/**/*"]
