version: '0.2.0.dev0'
name: case-014
custom_extensions:
  - vendor_name: bi-platform
    data: '{"version": 1, "semantic_version": "0.1.0"}'
datasets:
  - name: measurements
    source: measurements
    primary_key:
      - measurement_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "entity": "measurement"}'
    fields:
      - name: measurement_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: measurement_id
      - name: amount
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: amount
metrics:
  - name: amount_sum
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: 'SUM(measurements.amount)'
  - name: amount_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: 'COUNT(measurements.amount)'
  - name: row_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: 'COUNT(*)'
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "dataset": "measurements"}'
