version: '0.2.0.dev0'
name: case-004
custom_extensions:
  - vendor_name: bi-platform
    data: '{"version": 1, "semantic_version": "0.1.0"}'
datasets:
  - name: orders
    source: orders
    primary_key:
      - order_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "entity": "order"}'
    fields:
      - name: order_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: order_id
      - name: customer_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: customer_id
      - name: order_total
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: order_total
  - name: order_items
    source: order_items
    primary_key:
      - item_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "entity": "item"}'
    fields:
      - name: item_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: item_id
      - name: order_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: order_id
  - name: customers
    source: customers
    primary_key:
      - customer_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "entity": "customer"}'
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: customer_id
      - name: region
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: region
        dimension: {}
        custom_extensions:
          - vendor_name: bi-platform
            data: '{"version": 1, "dimension": "region"}'
relationships:
  - name: order
    from: order_items
    to: orders
    from_columns:
      - order_id
    to_columns:
      - order_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "optionality": "required"}'
  - name: customer
    from: orders
    to: customers
    from_columns:
      - customer_id
    to_columns:
      - customer_id
    custom_extensions:
      - vendor_name: bi-platform
        data: '{"version": 1, "optionality": "required"}'
metrics:
  - name: order_revenue
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: 'SUM(orders.order_total)'
  - name: item_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: 'COUNT(order_items.item_id)'
