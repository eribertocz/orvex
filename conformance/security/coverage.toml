# Which cases cover each scenario the roadmap row P3-01 and ADR-0027 §6 require (#435).
# tests/conformance/test_security_scenarios.py fails when an item has no case, or names one that
# does not exist. Governed with the cases: the Owner merges every change here.

[roadmap]
"pages" = ["SEC-PAGES-001", "SEC-PAGES-002", "SEC-PAGES-003", "SEC-PAGES-004"]
"page-bound queries" = ["SEC-PAGEQ-001", "SEC-PAGEQ-002", "SEC-PAGEQ-003", "SEC-PAGEQ-004"]
"rows" = ["SEC-ROWS-001", "SEC-ROWS-002", "SEC-ROWS-003", "SEC-ROWS-004", "SEC-ROWS-005", "SEC-ROWS-006", "SEC-ROWS-007", "SEC-ROWS-008", "SEC-ROWS-009"]
"columns" = ["SEC-COLUMNS-001", "SEC-COLUMNS-002", "SEC-COLUMNS-007", "SEC-COLUMNS-009"]
"masking" = ["SEC-COLUMNS-003", "SEC-COLUMNS-004", "SEC-COLUMNS-005", "SEC-COLUMNS-006", "SEC-COLUMNS-008"]
"cache" = ["SEC-CACHE-001", "SEC-CACHE-002", "SEC-CACHE-003", "SEC-CACHE-004"]
"export" = ["SEC-EXPORT-001", "SEC-EXPORT-002", "SEC-EXPORT-003"]
"possible values" = ["SEC-VALUES-001", "SEC-VALUES-002", "SEC-VALUES-003"]
"MCP" = ["SEC-MCP-001", "SEC-MCP-002", "SEC-MCP-003"]
"missing attributes" = ["SEC-MISSING-001", "SEC-MISSING-002", "SEC-MISSING-003", "SEC-MISSING-004"]
"indirect leakage (Owner, 2026-11-10)" = ["SEC-LEAK-001", "SEC-LEAK-002", "SEC-LEAK-003", "SEC-LEAK-004", "SEC-LEAK-005", "SEC-LEAK-006", "SEC-LEAK-007", "SEC-LEAK-008", "SEC-LEAK-009"]
"revocation (Owner, 2026-11-10)" = ["SEC-REVOKE-001", "SEC-REVOKE-002", "SEC-REVOKE-003", "SEC-REVOKE-004", "SEC-REVOKE-005"]

[adr_0027]
"a caller with no mapping, under an allow-list" = ["SEC-DQ-001"]
"a caller with no mapping, under a deny-list" = ["SEC-DQ-002"]
"a registered deny-list caller with nothing blocked" = ["SEC-DQ-003"]
"a mapping above the cap" = ["SEC-DQ-004"]
"a NULL in a deny-list mapping" = ["SEC-DQ-005"]
"a view, and a macro, in an existing lake" = ["SEC-DQ-006", "SEC-DQ-007"]
"a data file outside an existing lake's declared data location" = ["SEC-DQ-008"]
"a symbolic link in the data location that points outside it, including one swapped in after verification" = ["SEC-DQ-009", "SEC-DQ-010"]
"a hard link in the data location to a managed-lake data file" = ["SEC-DQ-011"]
"an existing lake that registers a file of a Route A file source, by absolute path or by hard link" = ["SEC-DQ-012"]
"an existing lake that registers a data file or file-source file of another project, by absolute path or by hard link" = ["SEC-DQ-013"]
"a managed-lake location or file source registered in another project after an existing lake whose location contains it" = ["SEC-DQ-014"]
"a SQLite catalog file, or its -wal, -shm or -journal file, replaced by a symbolic or hard link" = ["SEC-DQ-015"]
"a PostgreSQL catalog exposing another schema's rows through an invoker view, or a catalog role shared or able to read outside its schema" = ["SEC-DQ-016"]
"a policy whose mapping subquery reads a table outside the managed lake" = ["SEC-DQ-017"]
"an existing lake whose declared location contains the managed lake's data location" = ["SEC-DQ-018"]
"a restored external catalog that reuses snapshot ids" = ["SEC-DQ-019"]
"a mapping or a registration revoked while a result on that engine is cached" = ["SEC-DQ-020"]
