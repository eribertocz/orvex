id: SEC-CACHE-004
area: cache
title: A cached result is never served after the data changes
intent: 'A row is deleted between two identical questions: the second never shows it, on every engine.
  Where an engine cannot guarantee a data version, the cache is off for that dataset (#449 Q7).'
fixture: direct-query
caller: &id001
  kind: security_context
  version: 1
  user: u-open
  project: direct-query
  role: author
  groups:
  - operations
  attributes: {}
  permission_fingerprint: sha256:75728b6bd97e5fb584a6076b75cdee35a2b414905635756ff9eaad4bb872d3b7
request:
  kind: sequence
  steps:
  - caller: *id001
    request:
      kind: semantic-query
      body: &id002
        kind: semantic_query
        version: 1
        mode: detail
        fields:
        - member: outages.outage_id
        - member: outages.zone_id
        - member: outages.minutes
        order:
        - by: outages.outage_id
          direction: asc
        page:
          size: '100'
  - caller: *id001
    request:
      kind: semantic-query
      body: *id002
    change:
      op: delete_row
      table: outages
      row:
        outage_id: 3
expect:
  outcome: rows
  rows: 'outages.outage_id,outages.zone_id,outages.minutes

    1,Z1,15.00

    2,Z2,25.50

    '
  forbidden:
  - '40.25'
control:
  caller: *id001
  outcome: rows
  rows: 'outages.outage_id,outages.zone_id,outages.minutes

    1,Z1,15.00

    2,Z2,25.50

    3,Z3,40.25

    '
  without_changes: true
engines:
- managed
- existing-ducklake
- clickhouse
pending_engines:
  existing-ducklake: P5-14
