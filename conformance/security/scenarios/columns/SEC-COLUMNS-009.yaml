id: SEC-COLUMNS-009
area: columns
title: A metric is only visible or hidden, never masked
intent: A column policy that masks a metric makes the policies invalid, so the model is not served.
fixture: utility
caller: &id001
  kind: security_context
  version: 1
  user: u-zone1
  project: utility
  role: author
  groups: []
  attributes: {}
  permission_fingerprint: sha256:44b2b208870918c65d8d4ccb3c04b4116a39b8538fb96def9fc82a19a59f52e1
request:
  kind: sequence
  steps:
  - caller: *id001
    request:
      kind: semantic-query
      body:
        kind: semantic_query
        version: 1
        mode: aggregate
        metrics:
        - metric: total_kwh
        group_by:
        - member: readings.zone_id
        order:
        - by: readings.zone_id
          direction: asc
    change:
      op: replace_column_policy
      member: total_kwh
      default: masked
      mask: '***'
expect:
  outcome: error
  code: POLICY_INVALID
  forbidden:
  - '30.75'
control:
  caller: *id001
  outcome: rows
  rows: 'readings.zone_id,total_kwh

    Z1,30.75

    '
  without_changes: true
engines:
- managed
