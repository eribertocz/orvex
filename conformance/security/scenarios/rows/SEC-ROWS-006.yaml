id: SEC-ROWS-006
area: rows
title: Detail rows are the caller's rows, and an exempt group sees all
intent: A detail query lists only the caller's readings; the exempt management group lists every reading.
fixture: utility
caller:
  kind: security_context
  version: 1
  user: u-zone1
  project: utility
  role: author
  groups: []
  attributes: {}
  permission_fingerprint: sha256:44b2b208870918c65d8d4ccb3c04b4116a39b8538fb96def9fc82a19a59f52e1
request:
  kind: semantic-query
  body:
    kind: semantic_query
    version: 1
    mode: detail
    fields:
    - member: readings.reading_id
    - member: readings.consumer_id
    order:
    - by: readings.reading_id
      direction: asc
    page:
      size: '100'
expect:
  outcome: rows
  rows: 'readings.reading_id,readings.consumer_id

    1,C1

    2,C2

    '
  forbidden:
  - C3
  - C4
control:
  caller:
    kind: security_context
    version: 1
    user: u-exempt
    project: utility
    role: author
    groups:
    - management
    attributes: {}
    permission_fingerprint: sha256:5fb34253cadda8267259755dd39445d7947212f596678f2d76f028ec1e1ee39a
  outcome: rows
  rows: 'readings.reading_id,readings.consumer_id

    1,C1

    2,C2

    3,C3

    4,C4

    5,C3

    '
engines:
- managed
