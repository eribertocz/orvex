# The managed-lake tables of the fixture (the mapping and registration tables of its policies).
# `outages` is unqualified: another engine reads it from its connection's own database or lake.
# `lake.toml` describes the existing DuckLake the `outages` dataset is read from.
[tables."security.user_zone"]
file = "data/user_zone.csv"
columns = [["user_id", "VARCHAR", false], ["zone_id", "VARCHAR", false]]

[tables."security.blocked_zone"]
file = "data/blocked_zone.csv"
columns = [["user_id", "VARCHAR", false], ["zone_id", "VARCHAR", true]]

[tables."security.registered"]
file = "data/registered.csv"
columns = [["user_id", "VARCHAR", false]]

[tables."outages"]
file = "data/outages.csv"
columns = [["outage_id", "BIGINT", false], ["zone_id", "VARCHAR", false], ["minutes", "DECIMAL(18,2)", false]]
