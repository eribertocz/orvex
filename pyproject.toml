# Workspace configuration only: each module is its own distribution under packages/.
# There is intentionally no [project] table here.

[dependency-groups]
# Runtime dependencies of the workspace packages, pinned exactly; each package declares the same
# pins (tests/workspace/test_lock_files.py checks both). Locked together with `dev`.
runtime = [
  "cryptography==50.0.2",
  "duckdb==2.0.0",
  "fastapi==0.162.3",
  "jsonschema==4.26.0",
  "pg8000==1.31.6",
  "pyarrow==26.0.1",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "tzdata==2026.6",
  "uvicorn==0.54.0",
]
dev = [
  "coverage==7.17.2",
  "datamodel-code-generator==0.92.0",
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "httpx2==2.16.0",
  "hypothesis==6.170.15",
  "moto==5.2.5",
  "mypy==2.4.1",
  "openapi-spec-validator==0.9.0",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "setuptools==84.2.1",
  "types-jsonschema==4.26.0.20261006",
  "types-pyyaml==6.0.12.20261103",
]

# Branch coverage of the critical sources (#429): measured on the whole suite only, the same on
# every Python; `tools/ci/coverage_floor.py` checks it against `tools/ci/coverage-floor.toml`.
# `ctrace` (sys.settrace), not `sysmon`: another sys.monitoring tool in the run (Hypothesis'
# explain phase on 3.14; on 3.15 more than that) drops sysmon's events, and the same commit then
# measured differently from run to run. Twice as slow, on the whole-suite runs only.
[tool.coverage.run]
core = "ctrace"
branch = true
parallel = true
relative_files = true
source = ["packages"]
omit = ["*/tests/*", "*/build/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "UP",       # modern syntax
  "B",        # likely bugs
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PT",       # pytest style
  "RUF",      # ruff-specific checks
  "ANN",      # type annotations everywhere
  "BLE",      # no blind `except Exception`
  "T20",      # no print() in product code
  "ERA",      # no commented-out code
  "TD", "FIX" # no TODO / FIXME at merge time
]

[tool.ruff.lint.per-file-ignores]
# Repository automation scripts (standard library only, P0-01):
# - T20: they report to the GitHub Actions log through stdout;
# - PT009, PT027: their tests use unittest because pytest is not available to them;
# - ANN401: the REST client returns decoded JSON, whose shape is only known to the caller.
".github/workflows/scripts/*.py" = ["T20", "PT009", "PT027", "ANN401"]
# Repository tools are command-line programs that report through stdout.
"tools/**/*.py" = ["T20"]
# Conformance runners are command-line programs that report through stdout.
"conformance/runners/*.py" = ["T20"]
# The command line prints its user-facing output.
"packages/server/src/*/server/cli.py" = ["T20"]
# Generated contract types carry the contracts' descriptions verbatim.
"packages/contracts/src/*/contracts/*/v*.py" = ["E501"]
"tests/contracts/generated/*.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.14"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra", "-p", "tests.support.critical_tests"]
pythonpath = ["."]
testpaths = ["packages", "tests"]
xfail_strict = true
filterwarnings = ["error"]

# pyarrow ships no type information (no py.typed); its values are typed as Any at the boundary.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pg8000", "pg8000.*"]
ignore_missing_imports = true
